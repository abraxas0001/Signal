[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Readability + linkedom are only loaded on the news-article path, but they
  # still need to be traced into the bundle.
  external_node_modules = []

[functions."diag"]
  # Five live extractions in sequence; the default 10s is nowhere near enough.
  timeout = 60

[functions."analyse"]
  # The pipeline is one fetch plus one LLM call; the default 10s is not enough.
  # Netlify allows up to 60s for synchronous functions.
  timeout = 60

[functions."grievance"]
  # A batch is up to ten articles, each a fetch plus a classification and a
  # misinformation pass. They run concurrently and stream back as they land,
  # but the whole batch still needs the full window — without this the
  # endpoint was killed mid-batch and the desk returned nothing at all.
  timeout = 60

[functions."influencers"]
  # Reads several accounts and scores whatever mentions the office, which is
  # one fetch per account before any model call happens.
  timeout = 60

[functions."oauth-callback"]
  # Two sequential upstream calls (token exchange, then whoAmI), each with its
  # own 9s timeout — worst case is close to the platform default of 10s.
  timeout = 30

[functions."opinion"]
  # A grounded web search plus a structuring call. Runs rarely and is cached.
  timeout = 60

[functions."news-sources"]
  # One grounded search plus up to eight live page reads, each of which has to
  # be fetched and counted before it can be trusted as a source. Runs rarely.
  timeout = 60

[functions."connections"]
  # The Meta status check calls whoAmI() live, with a 9s timeout of its own.
  timeout = 20

# The SPA catch-all. Functions declared with `config.path` are matched by
# Netlify *before* redirects, so /api/analyse reaches the function and never
# falls through to index.html — but this rule is scoped to exclude /api anyway
# so a future non-config-path function cannot be shadowed by it.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Post thumbnails come from every CDN under the sun, so img-src is open;
    # script-src stays locked to self.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Hashed assets are immutable; the HTML shell must never be cached.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false
