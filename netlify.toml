[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Readability + linkedom are only loaded on the news-article path, but they
  # still need to be traced into the bundle.
  external_node_modules = []

[functions."diag"]
  # Five live extractions in sequence; the default 10s is nowhere near enough.
  timeout = 60

[functions."analyse"]
  # The pipeline is one fetch plus one LLM call; the default 10s is not enough.
  # Netlify allows up to 60s for synchronous functions.
  timeout = 60

[functions."grievance"]
  # A batch is up to ten articles, each a fetch plus a classification and a
  # misinformation pass. They run concurrently and stream back as they land,
  # but the whole batch still needs the full window — without this the
  # endpoint was killed mid-batch and the desk returned nothing at all.
  timeout = 60

[functions."influencers"]
  # Reads several accounts and scores whatever mentions the office, which is
  # one fetch per account before any model call happens.
  timeout = 60

[functions."oauth-callback"]
  # Two sequential upstream calls (token exchange, then whoAmI), each with its
  # own 9s timeout — worst case is close to the platform default of 10s.
  timeout = 30

[functions."suggest-posts"]
  # One model call over an issue and the records behind it, drafting three or
  # four short posts. The same shape as "recovery" below, and it needs the same
  # window: on the platform's 10s default the Draft posts button would 502
  # intermittently and the issue card would blame the network for a model that
  # was still writing.
  timeout = 30

[functions."post-idea"]
  # One model call over a single post's stored reading, answering what to post
  # next and drafting the post in the same breath. The same shape and the same
  # cost as "suggest-posts" above, so it gets the same window: on the platform's
  # 10s default the highlights screen would blame the network for a model that
  # was still writing.
  timeout = 30

[functions."post-copy"]
  # One model call for the words on one poster: a headline, the line under it
  # and the caption. The same shape and the same cost as the two blocks above,
  # so it gets the same window. It is also the most visible place to be wrong
  # about this: the studio shows a live preview, so a kill at the platform's 10s
  # default would leave the office watching an empty poster and blaming the
  # network for a model that was still writing.
  timeout = 30

[functions."scan"]
  # It had no block at all, so it ran on the platform's 10s default while
  # reading eight mastheads with a 9s fetch timeout each. That was already over
  # budget before any judging existed. With a subject it now also spends one
  # model call per fifteen headlines, against a 45s deadline the function holds
  # itself to, and a kill here would throw away a harvest already paid for.
  timeout = 60

[functions."daily-scan"]
  # The morning pass over every registered desk, reachable by hand at its URL.
  # The cron does NOT live here: Netlify fails the whole build when a schedule
  # (from either file) meets a function that declares a path, so the schedule
  # rides on daily-scan-cron, a wrapper that invokes this same handler.
  # Raising this past 60 without also raising DAILY_SCAN_BUDGET_MS would just
  # move where the kill happens.
  timeout = 60

[functions."daily-scan-cron"]
  # The scheduled twin. Same run, same budget.
  timeout = 60

[functions."desk-registry"]
  # Opting a desk out walks its findings subcollection and deletes it in pages
  # of 400, which does not reliably finish in 10s. A desk that asks to be erased
  # and is only half erased is the worst outcome this endpoint has.
  timeout = 20

[functions."desk-auth"]
  # One scrypt verification plus one Firestore read; scrypt alone can take a
  # second on a cold function, and 10s leaves no room for a slow cold start.
  timeout = 20

[functions."post-plan"]
  # A five-plan generation with steps and drafts is the longest single answer
  # this product asks for, and it may run after a rate-limited provider has
  # already been tried and failed. 60 is Netlify's synchronous ceiling.
  timeout = 60

[functions."week-compare"]
  # One model call over a week of post titles; a long generation on a cold
  # start does not reliably fit the 10s default.
  timeout = 30

[functions."desk-sync"]
  # A pull reads the meta document plus one document per stored key, and a
  # push runs a transaction over the same set. Well inside a minute, not
  # reliably inside ten seconds.
  timeout = 30

[functions."recovery"]
  # One model call over criticism that has already been gathered, so no web
  # search and no second round trip. Well inside the window, but a plan over
  # eight themes is a long generation and the 10s default is not enough.
  timeout = 30

[functions."opinion"]
  # A grounded web search plus a structuring call. Runs rarely and is cached.
  timeout = 60

[functions."compare"]
  # The same shape as "opinion" above, and it was missing this block entirely.
  # The grounded search in lib/compare.ts allows itself 45s, so on the platform
  # default of 10s the request could never finish: the runtime killed the
  # function before the search's own timeout ever fired, and the screen showed
  # "Could not reach the server" for what was really a working search that was
  # never given time to answer. Split into two steps, the search half is still
  # the long pole.
  timeout = 60

[functions."news-sources"]
  # One grounded search plus up to eight live page reads, each of which has to
  # be fetched and counted before it can be trusted as a source. Runs rarely.
  timeout = 60

[functions."connections"]
  # The Meta status check calls whoAmI() live, with a 9s timeout of its own.
  timeout = 20

# The three below had no block at all, so they ran on the platform's 10s
# default while each spending far more than that — the same arithmetic that
# broke "compare" above, found by reviewing the licensed-provider wiring.

[functions."account-search"]
  # One InnerTube search, then a channel page and a feed for each of up to six
  # results when verify=1. The verification is the point — a subscriber count is
  # what separates a real channel from a lookalike — but it is six sequential
  # pairs of fetches, so the 10s default is nowhere near enough.
  timeout = 60

[functions."handle"]
  # Already over budget before any provider existed: readYouTube alone can
  # spend 9s on the channel page, 8s on the RSS feed and 9s on InnerTube. The
  # endpoint also fans out over six handles at once, and the licensed read in
  # social-source.ts allows itself a further 15s. A kill here does not just
  # lose the gated account — it discards the follower counts every other
  # handle in the batch had already returned, and the screen blames the
  # reader's network for it.
  timeout = 30

[functions."rivals"]
  # One model call, then up to ten candidates read live, up to three handles
  # each, sequentially.
  timeout = 60

# The sync, and the endpoints that read what it stored.

[functions."sync-profiles"]
  # A pass is budgeted at 45s in the function itself, which is the number that
  # matters — this only has to be comfortably above it so the platform is never
  # the thing that stops a pass. The 15s of headroom is for the accounts
  # already read to be committed and the response assembled; a kill in that
  # window would discard a minute of deliberate waiting.
  timeout = 60

[functions."batch-track-all"]
  # The same pass, streamed. Same budget, same reasoning.
  timeout = 60

[functions."comparison-all-platforms"]
  # Two paths with very different costs. The default reads stored posts and
  # follower history out of Firestore and aggregates them — a handful of reads,
  # nowhere near this budget. `?live=1` instead reads each account through
  # readHandle, which is upstream requests, and a gated account lets itself
  # spend close to 30s before giving up. That path is capped at eight accounts
  # in the endpoint itself, but eight concurrent reads whose slowest member is
  # allowed 30s do not fit in 30s of function.
  #
  # This said 30 with a comment claiming the function made no network reads at
  # all. That was true when it was written and stopped being true in the same
  # change that added live=1 — which is how a timeout ends up sized for a
  # version of the code that no longer exists.
  timeout = 60

[functions."configure-tracking"]
  # Removing an account walks its posts and snapshots in pages of 400 and
  # deletes them, because Firestore does not delete subcollections with their
  # parent. An account with a long history is several round trips.
  timeout = 30

[functions."multi-platform-search"]
  # One search per platform, then a verification read of each candidate — the
  # verification is the point, and it is what makes this slower than a guess.
  timeout = 60

[functions."batch-multi-platform"]
  # Search plus extraction across several platforms in one request.
  timeout = 60

[functions."instagram-cache-status"]
  # A handful of Firestore reads. Nowhere near the default, listed only so the
  # sync-related endpoints are all accounted for in one place.
  timeout = 10

[functions."standing"]
  # readHandle, then several live post extractions, then a model call.
  timeout = 60

# The SPA catch-all. Functions declared with `config.path` are matched by
# Netlify *before* redirects, so /api/analyse reaches the function and never
# falls through to index.html — but this rule is scoped to exclude /api anyway
# so a future non-config-path function cannot be shadowed by it.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Post thumbnails come from every CDN under the sun, so img-src is open;
    # script-src stays locked to self.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Hashed assets are immutable; the HTML shell must never be cached.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false
